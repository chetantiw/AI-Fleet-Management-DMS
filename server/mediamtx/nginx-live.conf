# Only needed when ThingsBoard is served over HTTPS: the browser then refuses an http:// video
# frame inside the https:// dashboard. Add this inside the existing `server { listen 443 ssl; ... }`
# block for your ThingsBoard host, reload nginx, and set the vehicle's stream_view_url to
#   https://iot.example.com/live/veh-102/
# (tb_setup.py --stream-view https://iot.example.com/live/veh-102/).
# WebRTC media still flows on UDP/TCP 8189 directly to the server; keep that port open.

location /live/ {
    proxy_pass http://127.0.0.1:8889/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
}

# Optional HLS fallback (2-5 s delay, plain HTTPS only - works through strict office firewalls)
location /hls/ {
    proxy_pass http://127.0.0.1:8888/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
}
